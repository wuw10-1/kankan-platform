spring:
  datasource:
    url: jdbc:h2:mem:kankandb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: create
      id.new_generator_mappings: false
      generate-ddl: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        hbm2ddl.auto: create
        jdbc.lob.non_contextual_creation: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 开发环境不需要Redis，使用内存模拟

# JWT配置
jwt:
  secret: kankan_dev_jwt_secret_key_please_change_in_production
  expiration: 86400000 # 24小时

# 文件存储配置
file:
  upload-dir: ./uploads

# 日志配置
logging:
  level:
    com.kankan: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO